<!-- Meta tags Open Graph para redes sociais -->

<!-- Open Graph básico -->
<meta
  property="og:title"
  content="${ page_title }"
/>
<meta
  property="og:description"
  content="${ page_description }"
/>
<meta property="og:type" content="website" />
<meta property="og:url" content="${canonical_url}" />
<meta property="og:site_name" content="Tábua de Maré API" />
<meta property="og:locale" content="pt_BR" />

<!-- Imagens Open Graph -->
<meta property="og:image" content="${base_url}/pages/assets/og.webp" />
<meta property="og:image:secure_url" content="${base_url}/pages/assets/og.webp" />
<meta property="og:image:type" content="image/webp" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta
  property="og:image:alt"
  content="${ page_title }"
/>

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta
  name="twitter:title"
  content="${ page_title }"
/>
<meta
  name="twitter:description"
  content="${ page_description }"
/>
<meta name="twitter:image" content="${base_url}/pages/assets/og.x.webp" />
<meta
  name="twitter:image:alt"
  content="${ page_title }"
/>

<!-- Meta tags adicionais para SEO -->
<meta
  name="description"
  content="${ page_description }"
/>
<meta
  name="keywords"
  content="tábua de maré, API, marés, portos brasileiros, navegação, pesca, dados marítimos, Brasil"
/>
<meta name="author" content="Tábua de Maré API" />
<!-- Canonical URL -->
<link rel="canonical" href="${canonical_url}" />

<!-- Schema.org para Google -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebAPI",
    "name": "Tábua de Maré API",
    "description": "API gratuita com dados de tábuas de maré de portos brasileiros",
    "url": "https://tabuamare.api.br",
    "provider": {
      "@type": "Organization",
      "name": "Tábua de Maré API",
      "description": "Serviço brasileiro de dados de maré em API REST.",
      "url": "https://tabuamare.api.br",
      "logo": {
        "@type": "ImageObject",
        "url": "https://tabuamare.api.br/pages/assets/favicon-192x192.png"
      },
      "sameAs": [
        "https://github.com/Ddiidev/tabua_mare_api"
      ]
    },
    "documentation": "https://tabuamare.api.br/docs",
    "termsOfService": "https://tabuamare.api.br/termos",
    "inLanguage": "pt-BR"
  }
</script>
